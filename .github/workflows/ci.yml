name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: |
          go run ./cmd/cvdocx -lang pt-BR -o /tmp/pt.docx examples/curriculo-exemplo-ptbr.md
          go run ./cmd/cvdocx -lang en-US -o /tmp/en.docx examples/curriculo-exemplo-en.md
